version: 2

project_name: cloak-agent

before:
  hooks:
    - go mod tidy
    - npm --prefix daemon ci
    - npm --prefix daemon run build

builds:
  - id: cloak-agent
    main: .
    binary: cloak-agent
    ldflags:
      - -s -w -X github.com/nerveband/cloak-agent/cmd.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - CHANGELOG.md
      - src: daemon/dist/*
        dst: daemon/dist
        strip_parent: true
      - daemon/package.json
      - daemon/package-lock.json
      - scripts/install.sh
      - scripts/uninstall.sh
      - scripts/install.ps1
      - docs/tailgate.md
      - docs/commands.md
      - docs/upstream-sync-2026-08-24.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: nerveband
    name: cloak-agent
  draft: false
  prerelease: auto
