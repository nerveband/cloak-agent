name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform-unit:
    name: ${{ matrix.os }} build and unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - name: Install ffmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Verify recording prerequisites
        run: ffmpeg -version
      - name: Install daemon dependencies
        run: npm ci
        working-directory: daemon
      - name: Build daemon
        run: npm run build
        working-directory: daemon
      - name: Test daemon without browser integration
        run: npm test -- --exclude tests/integration.test.ts --exclude tests/session-safety.test.ts
        working-directory: daemon
      - name: Test Go CLI
        run: go test ./cmd/...
      - name: Build native Go CLI
        run: go build -o ${{ runner.os == 'Windows' && 'cloak-agent.exe' || 'cloak-agent' }} .

  linux-browser-integration:
    name: Linux browser integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - name: Install recording dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install daemon dependencies
        run: npm ci
        working-directory: daemon
      - name: Run native Linux browser integration
        run: npm test -- tests/integration.test.ts tests/session-safety.test.ts
        working-directory: daemon

  release-snapshot:
    name: Cross-build release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Verify release archive checksums
        run: |
          cd dist
          sha256sum --check checksums.txt
          tar -tzf cloak-agent_linux_amd64.tar.gz | grep -qx daemon/dist/daemon.js
          tar -tzf cloak-agent_darwin_arm64.tar.gz | grep -qx daemon/package-lock.json
          unzip -Z1 cloak-agent_windows_amd64.zip | grep -qx daemon/dist/daemon.js
          unzip -Z1 cloak-agent_windows_amd64.zip | grep -qx scripts/install.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  release:
    name: Publish verified tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [platform-unit, linux-browser-integration, release-snapshot]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Require matching tag and daemon version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./daemon/package.json').version")"
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
