name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform-unit:
    name: ${{ matrix.os }} build and unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - name: Install daemon dependencies
        run: npm ci
        working-directory: daemon
      - name: Build daemon
        run: npm run build
        working-directory: daemon
      - name: Test daemon without browser integration
        run: npm test -- --exclude tests/integration.test.ts
        working-directory: daemon
      - name: Test Go CLI
        run: go test ./cmd/...
      - name: Build native Go CLI
        run: go build -o ${{ runner.os == 'Windows' && 'cloak-agent.exe' || 'cloak-agent' }} .

  linux-browser-integration:
    name: Linux browser integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - name: Install daemon dependencies
        run: npm ci
        working-directory: daemon
      - name: Run native Linux browser integration
        run: npm test -- tests/integration.test.ts
        working-directory: daemon

  release-snapshot:
    name: Cross-build release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Verify release archive checksums
        run: |
          cd dist
          sha256sum --check checksums.txt
          tar -tzf cloak-agent_linux_amd64.tar.gz | grep -qx daemon/dist/daemon.js
          tar -tzf cloak-agent_darwin_arm64.tar.gz | grep -qx daemon/package-lock.json
          unzip -Z1 cloak-agent_windows_amd64.zip | grep -qx daemon/dist/daemon.js
          unzip -Z1 cloak-agent_windows_amd64.zip | grep -qx scripts/install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
